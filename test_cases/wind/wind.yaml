# Flow in a channel submitted to wind (TELEMAC manual ch. 59, wind set-up).
# 500 x 100 m closed basin, flat bed, still depth 2 m, west wind 5 m/s,
# c_w = a_wind rho_air/rho_water = 1.2615e-3, no bottom friction.
# Analytic: zs(x) = sqrt(H0^2 + 2 c_w W^2 x / g) with H0 = 1.56431 m from
# mass conservation; the two ends differ by 81.516 cm (manual 59.3;
# TELEMAC FV/FE reproduce it to 0.006%).  The steady balance is extracted
# as a time mean over the last 1500 s (~7 seiche periods) to filter the
# residual basin-scale oscillation (no friction -> weak numerical damping).
case:
  name: wind
  analytic: wind_setup
  t_end: 3000.0

mesh:
  type: rect
  xmin: 0.0
  xmax: 500.0
  ymin: 0.0
  ymax: 100.0
  dx: 5.0
  diagonal: alternating

physics:
  g: 9.81
  wind: {u: 5.0, v: 0.0, coeff: 1.2615e-3}

initial:
  type: lake_at_rest
  params: {zs: 2.0}

bathymetry:
  type: flat
  params: {z: 0.0}

boundary:
  groups:
    - {name: walls_xmin, select: {xmin: [0.0, 100.0]}, type: wall}
    - {name: walls_xmax, select: {xmax: [0.0, 100.0]}, type: wall}
    - {name: walls_ymin, select: {ymin: [0.0, 500.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 500.0]}, type: wall}

numerics:
  cfl: 0.8
  order: 1
  limiter: barth
  time_order: 1
  eps_dry: 1.0e-6

output:
  dir: output/wind
  vtk_interval: 0.0
  csv_interval: 10.0
  monitors:
    - {name: west, x: 2.5,   y: 50.0}
    - {name: mid,  x: 250.0, y: 50.0}
    - {name: east, x: 497.5, y: 50.0}
  centerline_y: 55.0
  band: 12.0
  average_window: 1500.0
