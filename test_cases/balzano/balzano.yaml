# Tidal-flat draw-down (TELEMAC validation manual ch. 3, balzano).
# 13,800 x 1,200 m channel; piecewise-linear bed with a sill crest at
# x = 4800 m (crest elevation 100/23 - 4800/920 = -0.8695652174 m).
# Initially at rest with a constant free surface zs = +2 m; the right
# boundary is held at zs = -2 m (constant, DATA/SL_downstream.txt), so
# the right reach drains and the left reservoir is trapped behind the
# sill, settling at the crest level with dry beaches on both flanks --
# severe wetting/drying and a well-balancedness test at t -> inf.
# Analytic equilibrium: piecewise lake at rest (manual section 3.2.5).
# Frictionless; TELEMAC HLLC config runs 70,000 s at CFL 0.9.
case:
  name: balzano
  analytic: balzano_drain
  t_end: 70000.0

mesh:
  type: rect
  xmin: 0.0
  xmax: 13800.0
  ymin: 0.0
  ymax: 1200.0
  dx: 60.0
  diagonal: alternating

physics:
  g: 9.81

initial:
  type: lake_at_rest
  params: {zs: 2.0}

bathymetry:
  type: bolzano
  params: {}

boundary:
  groups:
    - {name: sea,        select: {xmax: [0.0, 1200.0]},  type: level, value: -2.0}
    - {name: walls_xmin, select: {xmin: [0.0, 1200.0]},  type: wall}
    - {name: walls_ymin, select: {ymin: [0.0, 13800.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 13800.0]}, type: wall}

numerics:
  cfl: 0.9
  order: 1
  limiter: barth
  time_order: 1
  eps_dry: 1.0e-6

output:
  dir: output/balzano
  vtk_interval: 2500.0
  csv_interval: 100.0
  monitors:
    - {name: p1, x: 3600.0,  y: 600.0}
    - {name: p2, x: 8000.0,  y: 600.0}
  centerline_y: 600.0
  band: 550.0
