# Stoker (1957) dam break with a wet right state, flat frictionless bed.
# TELEMAC validation manual: T2 dam-break variant; the initial depths
# follow the TELEMAC example (hl = 1.0 m, hr = 0.2 m), x_dam = 8 m,
# T = 1.5 s, CFL 0.8.
case:
  name: dambreak_stoker
  analytic: stoker
  t_end: 1.5

mesh:
  type: rect
  xmin: 0.0
  xmax: 16.0
  ymin: 0.0
  ymax: 0.45
  dx: 0.05
  diagonal: alternating

physics:
  g: 9.81

initial:
  type: dam_snap
  params: {hl: 1.0, hr: 0.2, x_dam: 8.0}

bathymetry:
  type: flat
  params: {z: 0.0}

boundary:
  groups:
    - {name: walls_xmin, select: {xmin: [0.0, 0.45]}, type: wall}
    - {name: walls_ymin, select: {ymin: [0.0, 16.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 16.0]}, type: wall}
    - {name: outlet,     select: {xmax: [0.0, 0.45]}, type: outflow}

numerics:
  cfl: 0.8
  order: 1
  limiter: barth
  time_order: 1
  eps_dry: 1.0e-6

output:
  dir: output/dambreak_stoker
  vtk_interval: 0.5
  csv_interval: 0.05
  monitors:
    - {name: x10, x: 10.0, y: 0.225}
    - {name: x12.5, x: 12.5, y: 0.225}
  centerline_y: 0.225
  band: 0.02
