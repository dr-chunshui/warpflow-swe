# Ritter (1892) dam break on a dry, frictionless flat bed.
# TELEMAC validation manual: T2 - "Dam break on a dry floodplain" variant;
# h_l = 1.0 m, h_r = 0.0 (dry), x_dam = 8 m, T = 2.5 s, CFL 0.8.
case:
  name: dambreak_ritter
  analytic: ritter
  t_end: 2.5

mesh:
  type: rect
  xmin: 0.0
  xmax: 16.0
  ymin: 0.0
  ymax: 0.45
  dx: 0.05
  diagonal: alternating

physics:
  g: 9.81

initial:
  type: dam_snap
  params: {hl: 1.0, hr: 0.0, x_dam: 8.0}

bathymetry:
  type: flat
  params: {z: 0.0}

boundary:
  groups:
    - {name: walls_xmin, select: {xmin: [0.0, 0.45]}, type: wall}
    - {name: walls_ymin, select: {ymin: [0.0, 16.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 16.0]}, type: wall}
    - {name: outlet,     select: {xmax: [0.0, 0.45]}, type: outflow}

numerics:
  cfl: 0.8
  order: 1
  limiter: barth
  time_order: 1
  eps_dry: 1.0e-6

output:
  dir: output/dambreak_ritter
  vtk_interval: 0.5
  csv_interval: 0.05
  monitors:
    - {name: x10, x: 10.0, y: 0.225}
    - {name: x13.5, x: 13.5, y: 0.225}
  centerline_y: 0.225
  band: 0.02
