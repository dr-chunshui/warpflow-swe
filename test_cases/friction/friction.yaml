# Flow in a channel with slope and friction (TELEMAC manual ch. 27).
# 410 km x 450 m, bed zb = -4 - 1.8536585365e-5 x (the manual prints
# 1e-3; examples/friction/user_corfon.f uses 1e-5), Strickler K = 70,
# upstream Q = 6000 m3/s, downstream level 0 m (depth 11.6 m at the
# outlet).  TELEMAC simulates 55,000 s (still relaxing: manual fig. 27.5
# shows zs(x=0) ~ 6.4 m); the analytic reference is the fully relaxed
# GVF steady state, so we integrate to 300,000 s (~8 basin crossing
# times).  The initial state is a horizontal free surface at zs = 0
# (wet everywhere; TELEMAC's zs = -9 floods a dry upper reach first --
# same end state, but the dry-inflow Riemann problem is degenerate for
# cell-centred FV).
case:
  name: friction
  analytic: friction_gvf
  t_end: 300000.0

mesh:
  type: rect
  xmin: 0.0
  xmax: 410000.0
  ymin: 0.0
  ymax: 450.0
  dx: 1000.0
  diagonal: alternating

physics:
  g: 9.81
  strickler: 70.0

initial:
  type: lake_at_rest
  params: {zs: 0.0}

bathymetry:
  type: slope
  params: {z0: -4.0, slope: -1.8536585365e-5}

boundary:
  groups:
    - {name: inlet,  select: {xmin: [0.0, 450.0]}, type: inflow_q, value: 6000.0}
    - {name: outlet, select: {xmax: [0.0, 450.0]}, type: level, value: 0.0}
    - {name: walls_ymin, select: {ymin: [0.0, 410000.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 410000.0]}, type: wall}

numerics:
  cfl: 0.8
  order: 1
  limiter: barth
  time_order: 1
  eps_dry: 1.0e-6

output:
  dir: output/friction
  vtk_interval: 0.0
  csv_interval: 5000.0
  monitors:
    - {name: x5km,   x: 5000.0,   y: 225.0}
    - {name: x205km, x: 205000.0, y: 225.0}
    - {name: x405km, x: 405000.0, y: 225.0}
  centerline_y: 225.0
  band: 80.0
