# Draw-down over a pool (TELEMAC validation manual ch. 54, vasque).
# 46 x 9 m channel, bed zb = -0.6 + 0.01x + 0.1*exp(-((x-18)^2)/20)
# (user_corfon.f; the manual prints (x-19)^2 -- same typo family as
# balzano's printed coefficients).  At rest at zs = 0 (wet everywhere);
# the offshore boundary (x = 0) falls to -0.55 m as
# zs(t) = 0.275*(cos(2 pi t/600) - 1) (user_sl.f; with the solver's
# sine convention: mean = -0.275, amp = 0.275, period = 600,
# phase = pi/2), exposing the beach.  The pool behind the hump stays
# ponded at its spill level -0.3149 m (bed crest near x = 19) --
# severe wetting/drying with a partially dry end state.  The reference
# is the final equilibrium (manual section: horizontal pool level,
# zero velocity).  Strickler K = 40; TELEMAC adds 1e-2 m2/s velocity
# diffusivity, ignored here; TELEMAC runs 300 s at dt = 1.
case:
  name: vasque
  analytic: vasque_dry
  t_end: 300.0

mesh:
  type: rect
  xmin: 0.0
  xmax: 46.0
  ymin: 0.0
  ymax: 9.0
  dx: 1.0
  diagonal: alternating

physics:
  g: 9.81
  strickler: 40.0

initial:
  type: lake_at_rest
  params: {zs: 0.0}

bathymetry:
  type: vasque
  params: {}

boundary:
  groups:
    - {name: sea,        select: {xmin: [0.0, 9.0]}, type: level,
       value: -0.55,
       time: {mean: -0.275, amp: 0.275, period: 600.0, phase: 1.5707963267948966}}
    - {name: walls_xmax, select: {xmax: [0.0, 9.0]}, type: wall}
    - {name: walls_ymin, select: {ymin: [0.0, 46.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 46.0]}, type: wall}

numerics:
  cfl: 0.8
  order: 1
  limiter: barth
  time_order: 1
  eps_dry: 1.0e-6

output:
  dir: output/vasque
  vtk_interval: 50.0
  csv_interval: 10.0
  monitors:
    - {name: beach, x: 5.0,  y: 4.5}
    - {name: hump,  x: 19.0, y: 4.5}
    - {name: pool,  x: 24.0, y: 4.5}
    - {name: land,  x: 35.0, y: 4.5}
  centerline_y: 4.5
  band: 0.45
