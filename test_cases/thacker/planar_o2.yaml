# Thacker planar solution: sloshing free surface in a parabolic bowl.
# TELEMAC examples/thacker: 4x4 m domain, zb = 0.1*(r^2 - 1), eta = 0.5,
# omega = sqrt(2 g H0)/a = 1.4007 rad/s (period 4.485 s).  All walls.
case:
  name: thacker_planar_o2
  analytic: thacker_planar
  t_end: 10.0

mesh:
  type: rect
  xmin: 0.0
  xmax: 4.0
  ymin: 0.0
  ymax: 4.0
  dx: 0.04
  diagonal: alternating

physics:
  g: 9.81

initial:
  type: thacker_planar
  params: {h0: 0.1, a: 1.0, eta: 0.5, length: 4.0, xc: 2.0, yc: 2.0}

bathymetry:
  type: thacker
  params: {h0: 0.1, a: 1.0, xc: 2.0, yc: 2.0}

boundary:
  groups:
    - {name: walls_xmin, select: {xmin: [0.0, 4.0]}, type: wall}
    - {name: walls_xmax, select: {xmax: [0.0, 4.0]}, type: wall}
    - {name: walls_ymin, select: {ymin: [0.0, 4.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 4.0]}, type: wall}

numerics:
  cfl: 0.9
  order: 2
  limiter: barth
  time_order: 2
  eps_dry: 1.0e-6

output:
  dir: output/thacker_planar_o2
  vtk_interval: 0.5
  csv_interval: 0.1
  monitors:
    - {name: center, x: 2.5, y: 2.0}
    - {name: west,   x: 1.5, y: 2.0}
  centerline_y: 2.0
  band: 0.05

