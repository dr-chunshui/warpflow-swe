# Danube river reach near Deggendorf, Germany (TELEMAC validation
# manual ch. 22), 7.7 km with four bridges and groyne fields; a
# steady-flow test of zonal roughness.  The shipped geo_donau.slf
# carries a shifted/other-iteration bottom (0-10 m), so the terrain
# is taken from the BOTTOM variable of the TELEMAC FV reference
# f2d_donau.slf itself (bathymetry selafin_ref); the run is hot
# started from the same reference steady state (selafin_state) and
# re-balanced to steady state under Q = 218 m3/s at chain 4 (upstream,
# LIHBOR 4 + PRESCRIBED FLOWRATES) and level 309.205 m at chain 2
# (downstream, PRESCRIBED ELEVATIONS).  The 7 Nikuradse friction
# domains (ks 0.025 m main channel .. 10 m pier zones,
# roughness.tbl) are approximated by one calibrated equivalent Strickler
# K = 40 m^(1/3)/s (calibrated on the water-surface slope; Griffith gives 39 for the main channel,
# 28.6 groyne fields, 21-14 pier/structure zones).
#
# Acceptance: free surface vs f2d_donau.slf (node-wise L1/L2/Linf).
#
# Horizon note (2026-10-15): t_end was raised 6000 -> 60000 s.  The
# first 6000 s run was still filling (+131.7 m3/s net), and the
# 36000 s follow-up revealed a standing long-wave oscillation of the
# 7.7 km valley: the delivered inflow rate swings 120-310 m3/s around
# the prescribed mean 218 (period ~7500 s, mean exactly 218 -- the
# integral inflow control holds the average), while the level outlet
# drains a constant 218.  TELEMAC's larger numerical damping kills the
# same mode, so the honest steady-state comparison is the TIME AVERAGE
# of the last two oscillation periods (average_window).  With the
# level ghost repaired to the cdl_fv.f semantics (subcritical
# correction active) the time-averaged field gives L1 = 0.280: the
# surface sits uniformly +0.06..+0.12 m above the reference (equivalent
# K = 40 calibration + the cell-centred vs pinned-boundary-node
# comparison basis; TELEMAC's output nodes on the level chain are held
# at exactly 309.205 by bord.f), not a boundary-flux error.
case:
  name: donau
  t_end: 60000.0

mesh:
  type: selafin
  file: geo_donau.slf

physics:
  g: 9.81
  strickler: 40.0

initial:
  type: selafin_state
  params: {file: f2d_donau.slf, frame: 0}

bathymetry:
  type: selafin_ref
  params: {file: f2d_donau.slf}

boundary:
  groups:
    - {name: outlet, select: {chain: 2}, type: level, value: 309.205}
    - {name: inflow, select: {chain: 4}, type: inflow_q, value: 218.0}
    - {name: walls, select: {chain: rest}, type: wall}

numerics:
  cfl: 0.8
  order: 1
  limiter: barth
  time_order: 1
  eps_dry: 1.0e-6

output:
  dir: output/donau
  vtk_interval: 6000.0
  csv_interval: 250.0
  average_window: 15000.0
  monitors:
    - {name: upstream,   x: 64500.0, y: 11900.0}
    - {name: mid,        x: 67800.0, y: 11000.0}
    - {name: downstream, x: 71000.0, y: 9600.0}
  observed:
    telemac_ref: {file: f2d_donau.slf, var: S, mode: final_field}
