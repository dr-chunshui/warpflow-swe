# Solitary-wave run-up on a plane beach (TELEMAC validation manual
# ch. 48, tests_channel; Synolakis experiments).  50 x 1 m flume,
# depth d = 0.3832 m, flat to the toe at x = 14.68 m, then a 1:19.85
# slope.  The incident wave is the recorded gauge series
# slts_38p32cm.prn (Synolakis run 041, H = 0.0149 m -> H/d = 0.039,
# case 1) imposed as the x = 0 level boundary; other faces are
# perfect-slip walls (the x = 50 face is ~1.3 m above the still
# waterline and never wets).  Frictionless, as the FV column of the
# manual run-up table; target R/d = 0.084 (TELEMAC FV), experiment
# 0.076/0.078 (Synolakis).  Run-up is the time maximum of the free
# surface over the slope monitors below (0.125 m spacing).  No
# analytic solution: validation is the run-up metric.  TELEMAC runs
# 60 s at dt = 0.05.
case:
  name: tests_channel_cf
  analytic: ""
  t_end: 60.0

mesh:
  type: rect
  xmin: 0.0
  xmax: 50.0
  ymin: 0.0
  ymax: 1.0
  dx: 0.25
  diagonal: alternating

physics:
  g: 9.81
  strickler: 116.0   # quadratic-drag equivalent of the manual's Cf = 0.001

initial:
  type: lake_at_rest
  params: {zs: 0.3832}

bathymetry:
  type: beach
  params: {toe: 14.68, slope_inv: 19.85}

boundary:
  groups:
    - {name: wavemaker, select: {xmin: [0.0, 1.0]}, type: level,
       value: 0.3832, time: {series: slts_38p32cm.prn}}
    - {name: walls_xmax, select: {xmax: [0.0, 1.0]}, type: wall}
    - {name: walls_ymin, select: {ymin: [0.0, 50.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 50.0]}, type: wall}

numerics:
  cfl: 0.9
  order: 1
  limiter: barth
  time_order: 1
  eps_dry: 1.0e-6

output:
  dir: output/tests_channel_cf
  vtk_interval: 2.0
  csv_interval: 0.1
  monitors:
    - {name: flat, x: 5.0, y: 0.5}
    - {name: s120, x: 15.0, y: 0.5}
    - {name: s121, x: 15.125, y: 0.5}
    - {name: s122, x: 15.25, y: 0.5}
