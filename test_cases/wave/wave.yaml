# Propagation of waves in a channel (TELEMAC validation manual ch. 56).
# 16 x 0.3 m flume, still depth 10 m; harmonic level at the entrance
# H = 10 + 0.05 sin(2 pi t / 0.5) (manual eq. 56.3).  The outlet is a
# zero-gradient outflow: an imposed analytic-elevation level boundary
# reflects ~1/3 of the outgoing wave (the numerical phase lags the
# analytic one, so the strong imposition pumps a reflected wave back
# into the domain; with the outflow the u error halves).  Frictionless,
# no diffusion.  Analytic: eq. 56.2 with c = sqrt(g H0).  A pure
# propagation check (analytic wave as initial state, stopped before the
# wave reaches any boundary) converges at ~1.5 orders with zero phase
# lag: the interior scheme is clean and the residual error here is
# boundary handling (TELEMAC uses Thompson characteristic BCs).
case:
  name: wave
  analytic: wave_prog
  t_end: 5.0

mesh:
  type: rect
  xmin: 0.0
  xmax: 16.0
  ymin: 0.0
  ymax: 0.3
  dx: 0.05
  diagonal: alternating

physics:
  g: 9.81

initial:
  type: lake_at_rest
  params: {zs: 10.0}

bathymetry:
  type: flat
  params: {z: 0.0}

boundary:
  groups:
    - {name: inlet,  select: {xmin: [0.0, 0.3]}, type: level,
       time: {mean: 10.0, amp: 0.05, period: 0.5, phase: 0.0}}
    - {name: outlet, select: {xmax: [0.0, 0.3]}, type: outflow}
    - {name: walls_ymin, select: {ymin: [0.0, 16.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 16.0]}, type: wall}

numerics:
  cfl: 0.8
  order: 1
  limiter: barth
  time_order: 1
  eps_dry: 1.0e-6

output:
  dir: output/wave
  vtk_interval: 0.0
  csv_interval: 0.05
  monitors:
    - {name: x4,  x: 4.0,  y: 0.15}
    - {name: x8,  x: 8.0,  y: 0.15}
    - {name: x12, x: 12.0, y: 0.15}
  centerline_y: 0.15
  band: 0.13
