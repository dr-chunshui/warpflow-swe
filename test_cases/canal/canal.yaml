# Flow in a 500 x 100 m prismatic channel driven by a stage-discharge
# pair (TELEMAC validation manual ch. 9, canal).  Flat bottom,
# Strickler K = 50, at rest at zs = 0.5 m; upstream inflow ramped
# 0 -> 50 m3/s over 20 s in TELEMAC's liquid-boundary file (we impose
# the 50 m3/s from the start -- the startup surge washes out long
# before t_end); downstream level held at 0.5 m.  The steady state is
# a gradually-varied drawdown from ~0.75 m at x = 0 to 0.5 m at
# x = 500 m (manual fig. 9.2/9.4); the reference is the exact GVF
# profile dh/dx = (S0 - Sf)/(1 - Fr^2) marched upstream from the
# outlet control (same construction as the friction case).  TELEMAC
# adds 0.1 m2/s velocity diffusivity, irrelevant to the steady 1D
# balance; TELEMAC runs 4000 s at dt = 2.
case:
  name: canal
  analytic: friction_gvf
  t_end: 4000.0

mesh:
  type: rect
  xmin: 0.0
  xmax: 500.0
  ymin: 0.0
  ymax: 100.0
  dx: 5.0
  diagonal: alternating

physics:
  g: 9.81
  strickler: 50.0

initial:
  type: lake_at_rest
  params: {zs: 0.5}

bathymetry:
  type: flat
  params: {z: 0.0}

boundary:
  groups:
    - {name: inlet,  select: {xmin: [0.0, 100.0]}, type: inflow_q, value: 50.0}
    - {name: outlet, select: {xmax: [0.0, 100.0]}, type: level, value: 0.5}
    - {name: walls_ymin, select: {ymin: [0.0, 500.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 500.0]}, type: wall}

numerics:
  cfl: 0.8
  order: 1
  limiter: barth
  time_order: 1
  eps_dry: 1.0e-6

output:
  dir: output/canal
  vtk_interval: 0.0
  csv_interval: 500.0
  monitors:
    - {name: x25,  x: 25.0,  y: 50.0}
    - {name: x250, x: 250.0, y: 50.0}
    - {name: x475, x: 475.0, y: 50.0}
  centerline_y: 50.0
  band: 20.0
