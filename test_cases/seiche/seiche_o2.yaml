# Linear seiche in a closed basin: 200 x 1.8 m channel, flat bed,
# h = 10 + 0.01*cos(2*pi*x/L).  First-order scheme is strongly
# dissipative (expected, same conclusion as the TELEMAC manual);
# 7.4 periods T = L/sqrt(g*h0) = 20.19 s -> t_end = 149.4 s, CFL 0.5.
case:
  name: seiche_o2
  analytic: seiche
  t_end: 149.4

mesh:
  type: rect
  xmin: 0.0
  xmax: 200.0
  ymin: 0.0
  ymax: 1.8
  dx: 0.2
  diagonal: alternating

physics:
  g: 9.81

initial:
  type: seiche
  params: {h0: 10.0, amplitude: 0.01, length: 200.0, xmin: 0.0}

bathymetry:
  type: flat
  params: {z: 0.0}

boundary:
  groups:
    - {name: walls_xmin, select: {xmin: [0.0, 1.8]}, type: wall}
    - {name: walls_xmax, select: {xmax: [0.0, 1.8]}, type: wall}
    - {name: walls_ymin, select: {ymin: [0.0, 200.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 200.0]}, type: wall}

numerics:
  cfl: 0.5
  order: 2
  limiter: barth
  time_order: 2
  eps_dry: 1.0e-6

output:
  dir: output/seiche_o2
  vtk_interval: 0.0
  csv_interval: 0.32
  monitors:
    - {name: quarter, x: 50.0,  y: 0.9}
    - {name: mid,     x: 100.0, y: 0.9}
  centerline_y: 0.9
  band: 0.15

