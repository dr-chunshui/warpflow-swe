# Gaussian droplet in a square basin, open-boundary variant (TELEMAC
# validation manual ch. 28, gouttedo / Thompson).  Same 20.1 x 20.1 m
# flat basin and initial hump as the wall variant, but the whole
# perimeter is TELEMAC's Thompson open boundary (geo_thompson.cli: all
# nodes 4 4 4, OPTION FOR LIQUID BOUNDARIES = 2) with the exterior in
# the undisturbed lake state: outgoing waves leave without reflection.
# Our closest analogue is the zero-gradient outflow boundary.  Manual
# metrics: initial volume 999.784 m^3, volume that left the domain by
# t = 4 s = 27.83 m^3 (numerically lost 1.1e-5 m^3), no visible
# reflected waves.  Frictionless; TELEMAC runs 4 s at dt = 0.04.
case:
  name: gouttedo_thompson
  analytic: ""
  t_end: 4.0

mesh:
  type: rect
  xmin: 0.0
  xmax: 20.1
  ymin: 0.0
  ymax: 20.1
  dx: 0.3
  diagonal: alternating

physics:
  g: 9.81

initial:
  type: gaussian_hump
  params: {h0: 2.4, amp: 2.4, x0: 10.05, y0: 10.05, s2: 4.0}

bathymetry:
  type: flat
  params: {z: 0.0}

boundary:
  groups:
    - {name: open_xmin, select: {xmin: [0.0, 20.1]}, type: outflow}
    - {name: open_xmax, select: {xmax: [0.0, 20.1]}, type: outflow}
    - {name: open_ymin, select: {ymin: [0.0, 20.1]}, type: outflow}
    - {name: open_ymax, select: {ymax: [0.0, 20.1]}, type: outflow}

numerics:
  cfl: 0.9
  order: 1
  limiter: barth
  time_order: 1
  eps_dry: 1.0e-6

output:
  dir: output/gouttedo_thompson
  vtk_interval: 0.4
  csv_interval: 0.05
  monitors:
    - {name: center,  x: 10.05, y: 10.05}
    - {name: mid,     x: 15.00, y: 10.05}
    - {name: nearwall, x: 19.95, y: 10.05}
  centerline_y: 10.05
  band: 0.29
