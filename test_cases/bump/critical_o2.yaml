# Steady critical flow over the TELEMAC bump.  Q = 0.3 m^3/s; the flow
# passes through critical depth at the crest and becomes supercritical
# downstream (free outflow).  Boundary setup mirrors the TELEMAC
# geo_bump_tor.cli variant used by vnv_bumpcri_fv.py.
case:
  name: bump_critical_o2
  analytic: bump_cri
  t_end: 120.0

mesh:
  type: rect
  xmin: 0.0
  xmax: 20.0
  ymin: 0.0
  ymax: 2.0
  dx: 0.2
  diagonal: alternating

physics:
  g: 9.81

initial:
  type: bump_exact
  params: {flow: cri, q: 0.3, width: 2.0}

bathymetry:
  type: bump
  params: {amplitude: 0.25, x0: 10.0, sigma: 1.0}

boundary:
  groups:
    - {name: inlet,  select: {xmin: [0.0, 2.0]}, type: inflow_q, value: 0.3}
    - {name: outlet, select: {xmax: [0.0, 2.0]}, type: outflow}
    - {name: walls_ymin, select: {ymin: [0.0, 20.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 20.0]}, type: wall}

numerics:
  cfl: 0.9
  order: 2
  limiter: barth
  time_order: 2
  eps_dry: 1.0e-6

output:
  dir: output/bump_critical_o2
  vtk_interval: 0.0
  csv_interval: 2.0
  monitors:
    - {name: x5,  x: 5.0,  y: 1.0}
    - {name: x10, x: 10.0, y: 1.0}
    - {name: x15, x: 15.0, y: 1.0}
  centerline_y: 1.0
  band: 0.07
