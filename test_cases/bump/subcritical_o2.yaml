# Steady subcritical flow over the TELEMAC bump (validation manual T8).
# zb = 0.25*exp(-0.5*(x-10)^2) on a 20 x 2 m flume; Q = 1.5 m^3/s,
# downstream level zs = 0.8 m.  Frictionless, CFL 0.9 (TELEMAC FV cas).
case:
  name: bump_subcritical_o2
  analytic: bump_sub
  t_end: 120.0

mesh:
  type: rect
  xmin: 0.0
  xmax: 20.0
  ymin: 0.0
  ymax: 2.0
  dx: 0.2
  diagonal: alternating

physics:
  g: 9.81

initial:
  type: bump_exact
  params: {flow: sub, q: 1.5, width: 2.0, hl: 0.8}

bathymetry:
  type: bump
  params: {amplitude: 0.25, x0: 10.0, sigma: 1.0}

boundary:
  groups:
    - {name: inlet,  select: {xmin: [0.0, 2.0]}, type: inflow_q, value: 1.5}
    - {name: outlet, select: {xmax: [0.0, 2.0]}, type: level, value: 0.8}
    - {name: walls_ymin, select: {ymin: [0.0, 20.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 20.0]}, type: wall}

numerics:
  cfl: 0.9
  order: 2
  limiter: barth
  time_order: 2
  eps_dry: 1.0e-6

output:
  dir: output/bump_subcritical_o2
  vtk_interval: 0.0
  csv_interval: 2.0
  monitors:
    - {name: x5,  x: 5.0,  y: 1.0}
    - {name: x10, x: 10.0, y: 1.0}
    - {name: x15, x: 15.0, y: 1.0}
  centerline_y: 1.0
  band: 0.07
