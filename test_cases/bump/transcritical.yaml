# Steady transcritical flow over the TELEMAC bump.  Q = 0.45 m^3/s,
# downstream level zs = 0.35 m; the flow accelerates to supercritical
# over the crest and closes through a hydraulic jump on the lower
# glacis (jump position fixed by momentum matching, see analytic.py).
case:
  name: bump_transcritical
  analytic: bump_trans
  t_end: 120.0

mesh:
  type: rect
  xmin: 0.0
  xmax: 20.0
  ymin: 0.0
  ymax: 2.0
  dx: 0.2
  diagonal: alternating

physics:
  g: 9.81

initial:
  type: bump_exact
  params: {flow: trans, q: 0.45, width: 2.0, hl: 0.35}

bathymetry:
  type: bump
  params: {amplitude: 0.25, x0: 10.0, sigma: 1.0}

boundary:
  groups:
    - {name: inlet,  select: {xmin: [0.0, 2.0]}, type: inflow_q, value: 0.45}
    - {name: outlet, select: {xmax: [0.0, 2.0]}, type: level, value: 0.35}
    - {name: walls_ymin, select: {ymin: [0.0, 20.0]}, type: wall}
    - {name: walls_ymax, select: {ymax: [0.0, 20.0]}, type: wall}

numerics:
  cfl: 0.9
  order: 1
  limiter: barth
  time_order: 1
  eps_dry: 1.0e-6

output:
  dir: output/bump_transcritical
  vtk_interval: 0.0
  csv_interval: 2.0
  monitors:
    - {name: x5,  x: 5.0,  y: 1.0}
    - {name: x10, x: 10.0, y: 1.0}
    - {name: x15, x: 15.0, y: 1.0}
  centerline_y: 1.0
  band: 0.07
